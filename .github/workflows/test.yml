# GitHub Actions 自动化测试
# 触发条件：推送到 main/dev 分支、对 main 的 PR、以及每天 02:00 定时回归
#
# 说明：测试需要一个真实的 OpenCart 站点 + MySQL，因此本 workflow 会：
#   1. 启动 MySQL 8.0 服务容器
#   2. 下载官方 OpenCart 4.1.0.3（含演示数据），用 cli_install.php 命令行安装
#   3. 在同一 step 内启动 PHP 内置服务器并运行 pytest
#      （服务进程随 step 结束会被 runner 清理，因此不能拆成独立 step）
#
# Secret 配置（仓库 Settings -> Secrets and variables -> Actions）：
#   SMTP_PASSWORD / SMTP_USERNAME / NOTIFY_TO —— QQ 邮箱通知（SMTP_PASSWORD 为授权码，勿写明文）
#   DB_PASSWORD —— CI 临时 MySQL 的 root 密码（任意强密码即可，与本地 config.ini 无关）
#   全部经 ${{ secrets.* }} 注入，仓库内不落任何明文密码；SMTP 未配置时邮件步骤自动跳过。

name: 自动化测试

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

env:
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
  # 测试配置经环境变量注入（utils/config_reader.py 支持 SECTION_KEY 覆盖 config.ini）
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_DATABASE: xiangmu
  UI_BASE_URL: http://localhost:8080/

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: xiangmu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # 第1步：拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第2步：安装 PHP 及 OpenCart 所需扩展
      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, curl, zip, mbstring, intl
          coverage: none

      # 第3步：下载官方 OpenCart 4.1.0.3 并部署
      - name: 部署 OpenCart
        run: |
          curl -sSL -o opencart.zip https://github.com/opencart/opencart/releases/download/4.1.0.3/opencart-4.1.0.3.zip
          unzip -q opencart.zip -d oc_src
          # 兼容包内结构（顶层即站点，或含 upload/ 目录）
          if [ -d oc_src/upload ]; then
            mv oc_src/upload "$HOME/opencart"
          else
            mv oc_src "$HOME/opencart"
          fi
          chmod -R 777 "$HOME/opencart/system/storage"
          echo "OC_WEB=$HOME/opencart" >> "$GITHUB_ENV"

      # 第4步：命令行安装 OpenCart（en-gb 含演示商品，满足搜索/下单用例）
      - name: 安装 OpenCart
        run: |
          # cli_install 前置校验要求 config.php / admin/config.php 已存在（由模板复制）。
          # 注意：cli_install 对前置校验失败只是打印错误并正常退出（exit 0），
          # 不会建任何表——不先复制模板会"假成功"导致后续查不到 oc_customer 表。
          cp "$OC_WEB/config-dist.php" "$OC_WEB/config.php"
          cp "$OC_WEB/admin/config-dist.php" "$OC_WEB/admin/config.php"
          php "$OC_WEB/install/cli_install.php" install \
            --username admin \
            --email admin@example.com \
            --password 'Admin@12345' \
            --http_server 'http://localhost:8080/' \
            --language en-gb \
            --db_driver mysqli \
            --db_hostname 127.0.0.1 \
            --db_username root \
            --db_password "$DB_PASSWORD" \
            --db_database xiangmu \
            --db_port 3306 \
            --db_prefix oc_
          # 安装完成后删除 install 目录，避免被外部访问
          rm -rf "$OC_WEB/install"

      # 第5步：安装 Python 依赖与 Playwright 浏览器
      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m playwright install chromium --with-deps

      # 第6步：启动站点并运行测试
      # PHP 内置服务器为后台进程，跨 step 会被 runner 清理，故与测试放在同一 step。
      - name: 启动站点并运行测试
        run: |
          php -S 127.0.0.1:8080 -t "$OC_WEB" > php_server.log 2>&1 &
          # 等待站点就绪（最多 30 秒）
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "站点已就绪"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || { echo "站点未能启动:"; cat php_server.log; exit 1; }

          # 播种固定测试账号（全新安装的 OpenCart 没有该用户）
          python3 scripts/seed_test_user.py

          # 运行测试（显式顺序：UI 下单在前，DB 一致性验证在后）
          python3 -m pytest tests/test_ui/ tests/test_api/ tests/test_db/ --alluredir=allure-results -v

      # 第7步：上传测试报告
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: allure-results/

      # 第8步：发送邮件通知（SMTP_USERNAME/SMTP_PASSWORD/NOTIFY_TO 三个 Secrets 配齐才执行）
      - name: 发送邮件通知
        if: always() && env.SMTP_PASSWORD != '' && env.SMTP_USERNAME != '' && env.NOTIFY_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: GitHub Actions 测试结果通知
          body: |
            测试执行完成！

            构建编号: ${{ github.run_number }}
            触发分支: ${{ github.ref_name }}
            提交信息: ${{ github.event.head_commit.message }}

            请登录GitHub查看详细报告：
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
